<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SettleWise</title>
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <header class="topbar">
    <div class="brand">SettleWise</div>
    <div class="clock">
      <span class="clock-label">Demo clock</span>
      <span id="clockValue">--</span>
      <button data-advance="1" data-unit="day">+1 day</button>
      <button id="resetClock" class="ghost">Reset</button>
      <button id="resetDemo" class="ghost">Reset DB</button>
    </div>
  </header>

  <main id="app">
    <section id="profilesView">
      <table class="debt-table">
        <thead>
          <tr>
            <th>Borrower</th>
            <th>Outstanding</th>
            <th>Due</th>
            <th>Status</th>
            <th>Next action</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="debtTable"></tbody>
      </table>
    </section>

    <section id="progressView" class="hidden">
      <button id="backButton" class="ghost">&larr; All borrowers</button>

      <div class="progress-header">
        <div>
          <h1 id="progName"></h1>
          <div class="subtle" id="progPhone"></div>
          <div class="ref-hint" id="progRef"></div>
        </div>
        <div class="progress-actions">
          <button id="callBorrowerButton">Call borrower</button>
          <button id="smsBorrowerButton" class="ghost">Send SMS</button>
        </div>
      </div>

      <div id="callStatus" class="call-status hidden"></div>

      <dl class="facts" id="progFacts"></dl>

      <div class="metrics-row" id="progMetrics"></div>

      <div class="progress-bar-wrap">
        <div class="progress-bar"><div id="progressBarFill" class="progress-bar-fill"></div></div>
        <div id="progressBarLabel" class="subtle"></div>
      </div>

      <section id="lastCallPanel" class="panel hidden">
        <div class="panel-head">
          <h3>Latest call</h3>
          <span id="lastCallMeta" class="subtle"></span>
        </div>
        <div id="lastCallSummary" class="call-summary"></div>

        <!-- Native <details> so it's keyboard accessible and keeps its open
             state across the re-render that runs on window focus. -->
        <details id="lastCallDetails" class="call-details">
          <summary><span id="lastCallToggle">Call details</span></summary>

          <div class="split" id="lastCallSplit">
            <div id="agentStepsWrap">
              <h4>What the agent did</h4>
              <ol id="agentSteps" class="steps"></ol>
            </div>
            <div id="transcriptWrap">
              <h4>Transcript</h4>
              <div id="lastCallTranscript" class="transcript"></div>
            </div>
          </div>
        </details>
      </section>

      <div class="columns">
        <div>
          <h3>Call history</h3>
          <div id="callHistory" class="feed"></div>
        </div>
        <div>
          <h3>SMS activity</h3>
          <div id="smsHistory" class="feed"></div>
        </div>
        <div>
          <h3>Memory learned</h3>
          <div id="memoryList" class="feed"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Checkout, in-page. Opening /pay/:id in a tab meant leaving the dashboard
       mid-demo and coming back to a stale page; here the amount lands on the
       borrower's progress bar the moment it's paid. -->
  <div id="payOverlay" class="overlay hidden">
    <div class="pay-modal" role="dialog" aria-modal="true" aria-labelledby="payTitle">
      <button class="overlay-close" id="payClose" aria-label="Close">&times;</button>
      <div id="payBody"></div>
    </div>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
