<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SettleWise</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">SettleWise</div>
    <div class="clock">
      <span class="clock-label">Demo time</span>
      <span id="clockValue">--</span>
      <button data-advance="1" data-unit="hour">+1 hour</button>
      <button data-advance="1" data-unit="day">+1 day</button>
      <button data-advance="3" data-unit="day">+3 days</button>
      <button id="resetClock" class="ghost">Reset</button>
    </div>
  </header>

  <main id="app">
    <section id="profilesView">
      <div class="metrics-row" id="metricsRow"></div>

      <div class="toolbar">
        <div class="filters" id="filters">
          <button data-filter="all" class="active">All</button>
          <button data-filter="needs_call">Needs call</button>
          <button data-filter="promised">Promised</button>
          <button data-filter="paid">Paid</button>
          <button data-filter="needs_review">Needs review</button>
        </div>
      </div>

      <table class="debt-table">
        <thead>
          <tr>
            <th>Borrower</th>
            <th>Due</th>
            <th>Amount due</th>
            <th>Status</th>
            <th>Next action</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="debtTable"></tbody>
      </table>
    </section>

    <section id="progressView" class="hidden">
      <button id="backButton" class="ghost">&larr; All profiles</button>

      <div class="progress-header">
        <div>
          <h1 id="progName"></h1>
          <div class="subtle" id="progPhone"></div>
        </div>
        <div class="progress-actions">
          <button id="runAgentButton">Run agent</button>
        </div>
      </div>

      <div id="runResult" class="run-result hidden"></div>

      <div class="metrics-row" id="progMetrics"></div>

      <div class="progress-bar-wrap">
        <div class="progress-bar"><div id="progressBarFill" class="progress-bar-fill"></div></div>
        <div id="progressBarLabel" class="subtle"></div>
      </div>

      <div class="columns">
        <div>
          <h3>Call history</h3>
          <div id="callHistory" class="feed"></div>
        </div>
        <div>
          <h3>SMS activity</h3>
          <div id="smsHistory" class="feed"></div>
        </div>
        <div>
          <h3>Memory learned</h3>
          <div id="memoryList" class="feed"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
