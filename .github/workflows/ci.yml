name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check server tests
      - run: pytest tests -q

  r:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      # igraph links against GLPK; present on the local dev machine via
      # Homebrew's R build but not on a clean Ubuntu runner - without it
      # renv::restore() installs igraph fine but it fails to *load*
      # ("unable to load shared object ... igraph.so").
      - run: sudo apt-get update && sudo apt-get install -y libglpk-dev
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: intelligence
      - run: Rscript tests/run_tests.R
