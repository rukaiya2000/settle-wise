<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SettleWise collection workflow</title>
  <desc id="desc">An end-to-end workflow from the operations dashboard to a policy-bound voice call, payment link, payment update, follow-up, and a human-review branch for exceptions.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0d10"/><stop offset="1" stop-color="#14161a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5b8def"/></marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#fbbf24"/></marker>
    <style>
      .heading{font:700 38px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e8e9eb}.sub{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9aa3af}.label{font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e8e9eb}.body{font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9aa3af}.small{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9aa3af}.card{fill:#1c1f26;stroke:#3a4250;stroke-width:2}.accent{fill:#13224a;stroke:#5b8def;stroke-width:2}.teal{fill:#0c2b27;stroke:#2dd4bf;stroke-width:2}.green{fill:#0f2a1b;stroke:#4ade80;stroke-width:2}.amber{fill:#332006;stroke:#fbbf24;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="250" fill="#3564c7" opacity=".08"/><circle cx="1450" cy="730" r="280" fill="#2dd4bf" opacity=".06"/>
  <text x="80" y="85" class="heading">SettleWise: responsible collections, end to end</text>
  <text x="80" y="120" class="sub">Every borrower-facing amount and state change is checked by backend tools and policy.</text>
  <path d="M270 335H330 M520 335H580 M770 335H830 M1020 335H1080 M1270 335H1330" stroke="#5b8def" stroke-width="4" fill="none" marker-end="url(#blueArrow)" filter="url(#glow)"/>
  <g transform="translate(70 240)"><rect class="card" width="200" height="190" rx="18"/><rect class="accent" x="20" y="22" width="48" height="48" rx="12"/><text x="44" y="55" text-anchor="middle" font-size="27">⌁</text><text x="20" y="106" class="label">Ops dashboard</text><text x="20" y="137" class="body">Choose borrower</text><text x="20" y="162" class="body">Start a call</text></g>
  <g transform="translate(330 240)"><rect class="card" width="190" height="190" rx="18"/><circle class="teal" cx="44" cy="46" r="25"/><text x="44" y="54" text-anchor="middle" font-size="24">⌕</text><text x="20" y="106" class="label">Voice agent</text><text x="20" y="137" class="body">Calls borrower</text><text x="20" y="162" class="body">Calm, respectful</text></g>
  <g transform="translate(580 240)"><rect class="card" width="190" height="190" rx="18"/><circle class="teal" cx="44" cy="46" r="25"/><text x="44" y="55" text-anchor="middle" font-size="25">✓</text><text x="20" y="106" class="label">Identity check</text><text x="20" y="137" class="body">Confirm borrower</text><text x="20" y="162" class="body">before disclosure</text></g>
  <g transform="translate(830 220)"><rect class="teal" width="190" height="230" rx="18"/><text x="20" y="47" class="label">Policy tools</text><text x="20" y="74" class="label">+ SQLite</text><path d="M20 95H170" stroke="#2dd4bf" opacity=".45"/><text x="20" y="125" class="body">Account + balance</text><text x="20" y="151" class="body">Call eligibility</text><text x="20" y="177" class="body">Offer floor + limits</text><text x="20" y="203" class="body">Allowed actions only</text></g>
  <g transform="translate(1080 240)"><rect class="card" width="190" height="190" rx="18"/><rect class="accent" x="20" y="22" width="48" height="48" rx="12"/><text x="44" y="55" text-anchor="middle" font-size="26">$</text><text x="20" y="106" class="label">Negotiation</text><text x="20" y="137" class="body">Due this cycle</text><text x="20" y="162" class="body">Approved option</text></g>
  <g transform="translate(1330 240)"><rect class="green" width="200" height="190" rx="18"/><text x="20" y="47" class="label">SMS payment link</text><path d="M20 68H180" stroke="#4ade80" opacity=".45"/><text x="20" y="108" class="body">Borrower pays</text><text x="20" y="135" class="body">or receives reminder</text><text x="20" y="168" class="small" fill="#4ade80">Secure, simple next step</text></g>
  <path d="M270 335H330 M520 335H580 M770 335H830 M1020 335H1080 M1270 335H1330" stroke="#5b8def" stroke-width="4" fill="none" marker-end="url(#blueArrow)" filter="url(#glow)"/>
  <path d="M1430 445V625H1250" stroke="#4ade80" stroke-width="4" fill="none" marker-end="url(#blueArrow)" filter="url(#glow)"/>
  <g transform="translate(820 655)"><rect class="green" width="430" height="105" rx="18"/><text x="25" y="42" class="label">Payment + update</text><text x="25" y="70" class="body">Payment, transcript, memory, and next action are recorded.</text><text x="25" y="93" class="small" fill="#4ade80">✓ Progress is visible to the operator</text></g>
  <path d="M820 710H700Q635 710 635 650V610" stroke="#5b8def" stroke-width="3" fill="none" stroke-dasharray="9 9" marker-end="url(#blueArrow)"/>
  <g transform="translate(365 650)"><rect class="accent" width="270" height="110" rx="18"/><text x="22" y="42" class="label">Reminder or follow-up</text><text x="22" y="70" class="body">Scheduler checks the next action</text><text x="22" y="93" class="body">on the demo clock.</text></g>
  <path d="M425 430V505" stroke="#fbbf24" stroke-width="4" fill="none" marker-end="url(#amberArrow)"/><path d="M1175 430V505" stroke="#fbbf24" stroke-width="4" fill="none" marker-end="url(#amberArrow)"/>
  <g transform="translate(700 500)"><rect class="amber" width="300" height="135" rx="18"/><text x="22" y="42" class="label">Exception detected</text><text x="22" y="72" class="body">Dispute, hardship, wrong person,</text><text x="22" y="97" class="body">or offer below policy floor</text><text x="22" y="121" class="small" fill="#fbbf24">Stop negotiation</text></g>
  <path d="M1000 567H1080" stroke="#fbbf24" stroke-width="4" fill="none" marker-end="url(#amberArrow)"/>
  <g transform="translate(1080 500)"><rect class="amber" width="250" height="135" rx="18"/><text x="22" y="42" class="label">Human review</text><text x="22" y="72" class="body">Review the transcript,</text><text x="22" y="97" class="body">context, and next step.</text><text x="22" y="121" class="small" fill="#fbbf24">Pause / resolve</text></g>
  <text x="80" y="835" class="sub">The agent cannot invent an amount or approve an exception: the offer engine and tools enforce the rules.</text>
</svg>
